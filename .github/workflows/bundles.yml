name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Check release tag
        id: read
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag must match the project version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheel:
    needs: [check, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: pip install uv==0.13.5
      - run: make wheel
      - name: Smoke-test the installed wheel
        shell: bash
        run: |
          uv venv wheel-check
          uv pip install --python wheel-check/bin/python dist/*.whl
          wheel-check/bin/claudex --version
          wheel-check/bin/claudex license | cmp - LICENSE
          wheel-check/bin/claudex models --example
          cd dist
          for artifact in *.whl *.tar.gz; do sha256sum "$artifact" > "$artifact.sha256"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  bundle:
    needs: [check, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            extension: tar.gz
          - runner: macos-15-intel
            target: darwin-x86_64
            extension: tar.gz
          - runner: ubuntu-24.04
            target: linux-x86_64
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            extension: tar.gz
          - runner: windows-2025
            target: windows-x86_64
            extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUNDLE: dist/claudex-${{ needs.version.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: command -v objdump || sudo apt-get install -y binutils
      - run: python -m pip install uv==0.13.5
      - name: Check Windows runtime
        if: runner.os == 'Windows'
        run: uv run --locked pytest tests/test_accounts.py tests/test_windows_runtime.py
      - run: uv run --locked --group bundle python scripts/bundle.py
      - name: Verify installer lifecycle
        run: uv run --locked python scripts/installer_smoke.py "$env:BUNDLE" --verify-windows-path
        if: runner.os == 'Windows'
      - name: Verify installer lifecycle
        run: uv run --locked python scripts/installer_smoke.py "$BUNDLE"
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bundle-${{ matrix.target }}
          path: |
            ${{ env.BUNDLE }}
            ${{ env.BUNDLE }}.sha256
          if-no-files-found: error

  bottle:
    needs: [check, version, bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
        with:
          core: false
          cask: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.target == 'darwin-x86_64'
        with:
          name: bundle-darwin-x86_64
          path: intel-bundle
      - name: Verify the Intel bundle
        if: matrix.target == 'darwin-x86_64'
        shell: bash
        run: |
          archive="claudex-$RELEASE_VERSION-darwin-x86_64.tar.gz"
          cd intel-bundle
          shasum -a 256 -c "$archive.sha256"
          mkdir -p "$(brew --cache)"
          cp "$archive" "$(brew --cache)/claudex-ci-$archive"
          cmp "$archive" "$(brew --cache)/claudex-ci-$archive"
      - name: Prepare the formula for this commit
        shell: bash
        run: |
          brew tap-new --no-git nyorf/claudex
          tap_dir="$(brew --repository nyorf/claudex)"
          mkdir -p "$tap_dir/Formula"
          python3 - "$tap_dir/Formula/claudex.rb" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          source = Path('Formula/claudex.rb').read_text(encoding='utf-8')
          source = re.sub(r'\n  bottle do\n(?:    [^\n]*\n)+  end\n', '\n', source, count=1)
          revision = os.environ['GITHUB_SHA']
          version = os.environ['RELEASE_VERSION']
          source, count = re.subn(
              r'url "https://github.com/nyorf/claudex.git", tag: "v[0-9]+\.[0-9]+\.[0-9]+"(?:, revision: "[0-9a-f]{40}")?',
              f'url "https://github.com/nyorf/claudex.git", revision: "{revision}"\n'
              f'  version "{version}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not pin the bottle formula to this commit.')
          if os.environ['TARGET'] == 'darwin-x86_64':
              Path(os.environ['RUNNER_TEMP'], 'claudex-public.rb').write_text(source, encoding='utf-8')
              recipe = '''  def install
            archive = HOMEBREW_CACHE/"claudex-ci-claudex-#{version}-darwin-x86_64.tar.gz"
            system "tar", "-xzf", archive
            libexec.install (buildpath/"claudex").children
            bin.install_symlink libexec/"claudex"
            man1.install libexec/"claudex.1"
          end

          '''
              source, count = re.subn(r'  on_macos do\n[\s\S]*?(?=  test do\n)', recipe, source, count=1)
              if count != 1:
                  raise SystemExit('Could not prepare the Intel bottle formula.')
          Path(sys.argv[1]).write_text(source, encoding='utf-8')
          PY
      - name: Install the formula and test
        shell: bash
        run: |
          brew install --build-bottle nyorf/claudex/claudex
          if [[ "$TARGET" == darwin-x86_64 ]]; then
            cp "$RUNNER_TEMP/claudex-public.rb" "$(brew --repository nyorf/claudex)/Formula/claudex.rb"
            cp "$RUNNER_TEMP/claudex-public.rb" "$(brew --prefix nyorf/claudex/claudex)/.brew/claudex.rb"
            python3 - "$(brew --prefix nyorf/claudex/claudex)/INSTALL_RECEIPT.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as file:
              receipt = json.load(file)
          if receipt.get('runtime_dependencies') != []:
              raise SystemExit('The Intel bottle has unexpected runtime dependencies.')
          PY
          fi
          brew test nyorf/claudex/claudex
      - name: Bottle and test installation
        shell: bash
        run: |
          mkdir -p bottle-assets
          cd bottle-assets
          brew bottle --json --no-rebuild --root-url "https://github.com/nyorf/claudex/releases/download/v$RELEASE_VERSION" nyorf/claudex/claudex
          bottle=(claudex--*.bottle.tar.gz)
          test "${#bottle[@]}" -eq 1
          brew uninstall --ignore-dependencies nyorf/claudex/claudex
          brew trust --formula nyorf/claudex/claudex
          brew install "./${bottle[0]}"
          brew test nyorf/claudex/claudex
          if [[ "$TARGET" == darwin-x86_64 ]]; then
            brew linkage --test nyorf/claudex/claudex
            env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$(brew --prefix nyorf/claudex/claudex)/bin/claudex" --version
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-bottle-${{ matrix.target }}
          path: |
            bottle-assets/*.bottle.tar.gz
            bottle-assets/*.bottle.json
          if-no-files-found: error

  homebrew-formula:
    needs: [version, bottle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: bottle-assets
          pattern: homebrew-bottle-*
          merge-multiple: true
      - name: Verify bottles and generate formula
        shell: bash
        run: |
          python3 Formula/generate.py bottle-assets "$RELEASE_VERSION" "$GITHUB_SHA" generated-tap/Formula
          ruby -c generated-tap/Formula/claudex.rb
          tar -czf bottle-assets/claudex-homebrew-formula.tar.gz -C generated-tap Formula
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-release
          path: |
            bottle-assets/claudex-homebrew-formula.tar.gz
            bottle-assets/claudex-${{ needs.version.outputs.version }}.*.bottle.tar.gz
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, version, wheel, bundle, homebrew-formula]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify assets and prepare installers
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          assets = Path("release-assets")
          version = os.environ["RELEASE_VERSION"]
          targets = (
              ("darwin-arm64", "tar.gz"), ("darwin-x86_64", "tar.gz"),
              ("linux-arm64", "tar.gz"), ("linux-x86_64", "tar.gz"),
              ("windows-x86_64", "zip"),
          )
          names = [
              *(f"claudex-{version}-{target}.{extension}" for target, extension in targets),
              f"claudex-{version}-py3-none-any.whl",
              f"claudex-{version}.tar.gz",
          ]
          for name in names:
              file = assets / name
              line = (assets / f"{name}.sha256").read_text(encoding="ascii").split()
              digest = hashlib.sha256(file.read_bytes()).hexdigest()
              if line != [digest, name]:
                  raise SystemExit(f"Invalid checksum for {name}.")
          PY
          cp scripts/install.sh scripts/install.ps1 release-assets/
          rm -f release-assets/*--*.bottle.tar.gz release-assets/*.bottle.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes release-assets/*
