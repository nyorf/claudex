[project]
name = "claudex"
version = "1.0.1"
description = "Run Claude Code with inference from your ChatGPT plan"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio>=4.12,<5",
    "cryptography>=46.0.7,<51",
    "fastapi>=0.138.1,<0.163",
    "filelock>=3.20,<5",
    "httpx2>=2.13,<3",
    "keyring>=25.7,<26",
    "platformdirs>=4.5,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pyyaml>=6.0.3,<7",
    "starlette>=1.7,<2",
    "structlog>=26.1,<27",
    "uvicorn>=0.49,<0.55",
]

[project.scripts]
claudex = "claudex.cli:main"

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.8.6,<2",
    "import-linter>=2.1,<3",
    "pyright>=1.1.407,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.12,<1",
]
bundle = ["pyinstaller>=6.20,<7"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RET", "SIM", "C4", "ASYNC", "C90"]
# assertions narrow types and express expectations in tests
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# tests use synthetic credentials
"tests/*.py" = ["S105", "S106"]

[tool.bandit]
skips = ["B101"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.importlinter]
root_package = "claudex"

[[tool.importlinter.contracts]]
name = "domain must not import outer layers"
type = "forbidden"
source_modules = ["claudex.domain"]
forbidden_modules = [
    "claudex.api", "claudex.config", "claudex.infrastructure", "claudex.observability",
    "claudex.services",
]

[[tool.importlinter.contracts]]
name = "infrastructure must not import api or services"
type = "forbidden"
source_modules = ["claudex.infrastructure"]
forbidden_modules = ["claudex.api", "claudex.services"]

[[tool.importlinter.contracts]]
name = "services must not import api"
type = "forbidden"
source_modules = ["claudex.services"]
forbidden_modules = ["claudex.api"]

[[tool.importlinter.contracts]]
name = "observability must stay a leaf"
type = "forbidden"
source_modules = ["claudex.observability"]
forbidden_modules = ["claudex.api", "claudex.domain", "claudex.infrastructure", "claudex.services"]
